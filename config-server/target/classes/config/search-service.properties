# Centralized Configuration: Search Service
server.port=8087

# Resilience4j Circuit Breaker & Retry
resilience4j.circuitbreaker.instances.searchService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.searchService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.searchService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.searchService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.searchService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.searchService.maxAttempts=3
resilience4j.retry.instances.searchService.waitDuration=500ms
