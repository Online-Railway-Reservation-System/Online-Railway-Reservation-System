# API Gateway Configuration
server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Client
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Security / JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Microservice Core Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**, /api/v1/admin/customers/**

spring.cloud.gateway.routes[2].id=train-service
spring.cloud.gateway.routes[2].uri=lb://TRAIN-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/trains/**, /api/v1/admin/trains/**

spring.cloud.gateway.routes[3].id=station-route-service
spring.cloud.gateway.routes[3].uri=lb://STATION-ROUTE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/stations/**, /api/v1/routes/**, /api/v1/admin/stations/**, /api/v1/admin/routes/**

spring.cloud.gateway.routes[4].id=schedule-fare-service
spring.cloud.gateway.routes[4].uri=lb://SCHEDULE-FARE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/schedules/**, /api/v1/fares/**, /api/v1/admin/schedules/**, /api/v1/admin/fares/**

spring.cloud.gateway.routes[5].id=inventory-quota-service
spring.cloud.gateway.routes[5].uri=lb://INVENTORY-QUOTA-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/inventory/**, /api/v1/quotas/**, /api/v1/admin/coaches/**, /api/v1/admin/quotas/**

spring.cloud.gateway.routes[6].id=search-service
spring.cloud.gateway.routes[6].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/search/**

spring.cloud.gateway.routes[7].id=reservation-service
spring.cloud.gateway.routes[7].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/reservations/**, /api/v1/admin/reservations/**, /api/v1/tickets/**, /api/v1/food/**, /api/v1/admin/food/**

spring.cloud.gateway.routes[8].id=payment-refund-service
spring.cloud.gateway.routes[8].uri=lb://PAYMENT-REFUND-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/payments/**, /api/v1/admin/payments/**, /api/v1/refunds/**, /api/v1/admin/refunds/**

spring.cloud.gateway.routes[9].id=notification-service
spring.cloud.gateway.routes[9].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/notifications/**

# OpenAPI / Swagger Documentation Rewrites
spring.cloud.gateway.routes[10].id=openapi-auth-service
spring.cloud.gateway.routes[10].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[10].filters[0]=SetPath=/v3/api-docs

