server:
  port: 8083

spring:
  application:
    name: TRAIN-SERVICE
  datasource:
    url: jdbc:h2:mem:railway_train_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

eureka:
  client:
    enabled: false