<div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2>{{ 'auth.resetPassword' | translate }}</h2>
          <p>{{ step === 1 ? ('auth.enterEmailOtp' | translate) : ('auth.enterOtpNewPass' | translate) }}</p>
        </div>

        <!-- Step 1: Request OTP -->
        <form *ngIf="step === 1" [formGroup]="requestOtpForm" (ngSubmit)="onRequestOtp()" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">{{ 'auth.registeredEmail' | translate }}</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="form-control"
              placeholder="name@example.com"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" [disabled]="requestOtpForm.invalid || loading">
            <span *ngIf="loading" class="spinner"></span>
            {{ loading ? ('auth.sendingOtp' | translate) : ('auth.sendOtpBtn' | translate) }}
          </button>
        </form>

        <!-- Step 2: Reset Password with OTP -->
        <form *ngIf="step === 2" [formGroup]="resetPasswordForm" (ngSubmit)="onResetPassword()" class="auth-form">
          <div class="info-banner">
            {{ 'auth.otpDispatchedTo' | translate }} <strong>{{ sentEmail }}</strong>
          </div>

          <div class="form-group">
            <label class="form-label" for="otp">{{ 'auth.enterOtp' | translate }}</label>
            <input
              id="otp"
              type="text"
              formControlName="otp"
              class="form-control"
              placeholder="e.g. 123456"
              maxlength="6"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">{{ 'auth.newPassword' | translate }}</label>
            <input
              id="newPassword"
              type="password"
              formControlName="newPassword"
              class="form-control"
              [placeholder]="'auth.minCharsPlaceholder' | translate"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" [disabled]="resetPasswordForm.invalid || loading">
            <span *ngIf="loading" class="spinner"></span>
            {{ loading ? ('auth.updating' | translate) : ('auth.setNewPassword' | translate) }}
          </button>

          <button type="button" class="btn btn-link btn-block" (click)="step = 1">
            {{ 'auth.backChangeEmail' | translate }}
          </button>
        </form>

        <div class="auth-footer">
          <p>{{ 'auth.rememberPassword' | translate }} <a routerLink="/login">{{ 'auth.backToSignIn' | translate }}</a></p>
        </div>
      </div>
    </div>
